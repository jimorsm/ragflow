{{- $component := "worker" }}
{{- $name := include "ragflow.componentFullname" (dict "root" . "component" $component) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "ragflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ .Values.ragflow.worker.replicaCount }}
  {{- with .Values.ragflow.worker.deployment.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ragflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        {{- include "ragflow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
      {{- with .Values.ragflow.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- $globalPullSecrets := .Values.imagePullSecrets }}
      {{- $basePullSecrets := .Values.ragflow.image.pullSecrets }}
      {{- $workerImage := default (dict) .Values.ragflow.worker.image }}
      {{- $componentPullSecrets := default list $workerImage.pullSecrets }}
      {{- if or (or $globalPullSecrets $basePullSecrets) $componentPullSecrets }}
      imagePullSecrets:
        {{- with $globalPullSecrets }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $basePullSecrets }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with $componentPullSecrets }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- $localServiceConf := .Values.ragflow.service_conf }}
      {{- $llmFactories := .Values.ragflow.llm_factories }}
      {{- $consumerRange := .Values.ragflow.worker.consumerRange }}
      {{- $rangeEnabled := and $consumerRange $consumerRange.enabled }}
      {{- $consumeBegin := default 0 (and $consumerRange $consumerRange.begin) }}
      containers:
        - name: {{ $component }}
          {{- $imageRepository := default .Values.ragflow.image.repository $workerImage.repository }}
          {{- $imageTag := default .Values.ragflow.image.tag $workerImage.tag }}
          image: {{ printf "%s:%s" $imageRepository $imageTag }}
          {{- $pullPolicy := default .Values.ragflow.image.pullPolicy $workerImage.pullPolicy }}
          {{- with $pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          command:
            - /bin/bash
            - -lc
            - |
              set -eo pipefail
              cd /ragflow

              # MinerU installation logic
              if [[ "${USE_MINERU}" == "true" ]]; then
                export HUGGINGFACE_HUB_ENDPOINT="${HF_ENDPOINT:-https://hf-mirror.com}"
                export PIP_INDEX_URL="${PIP_INDEX_URL:-https://pypi.org/simple}"
                export PIP_EXTRA_INDEX_URL="${PIP_EXTRA_INDEX_URL:-https://pypi.org/simple}"

                default_prefix="/ragflow/uv_tools"
                venv_dir="${default_prefix}/.venv"
                exe="${MINERU_EXECUTABLE:-${venv_dir}/bin/mineru}"

                if [[ ! -x "${exe}" ]]; then
                  echo "[mineru] installing with mirrors..."
                  echo "[mineru] PyPI index: ${PIP_INDEX_URL}"
                  echo "[mineru] PyPI extra index: ${PIP_EXTRA_INDEX_URL}"
                  echo "[mineru] HF endpoint: ${HUGGINGFACE_HUB_ENDPOINT}"

                  mkdir -p "${default_prefix}"
                  cd "${default_prefix}"
                  uv venv "${venv_dir}"
                  source "${venv_dir}/bin/activate"
                  pkg="mineru[core]"
                  {{- with .Values.ragflow.mineru.version }}
                  pkg="${pkg}=={{ . }}"
                  {{- end }}
                  uv pip install -U "${pkg}" \
                    --index-url "${PIP_INDEX_URL}" \
                    --extra-index-url "${PIP_EXTRA_INDEX_URL}"
                  deactivate

                  if ! "${exe}" --help >/dev/null 2>&1; then
                    echo "[mineru] installation failed" >&2
                    exit 1
                  fi
                  echo "[mineru] installed successfully: ${exe}"
                else
                  echo "[mineru] already installed: ${exe}"
                fi
                export MINERU_EXECUTABLE="${exe}"
              fi

              # Application startup logic
              : "${POD_NAME:=$(hostname)}"
              export LD_LIBRARY_PATH="/usr/lib/x86_64-linux-gnu/"
              PY=python3
              JEMALLOC_PATH="$(pkg-config --variable=libdir jemalloc)/libjemalloc.so"
              HOST_ID="${HOST_ID:-${POD_NAME}}"
              CONSUMER_NO=0
              USE_RANGE={{ ternary "1" "0" $rangeEnabled }}
              if [[ "${USE_RANGE}" -eq 1 ]]; then
                CONSUMER_BEGIN={{ $consumeBegin }}
                CONSUMER_NO="${CONSUMER_BEGIN}"
              fi

              declare -a ARGS
{{- range $arg := .Values.ragflow.worker.extraArgs }}
              ARGS+=({{ $arg | quote }})
{{- end }}

              exec env LD_PRELOAD="${JEMALLOC_PATH}" "${PY}" rag/svr/task_executor.py "${HOST_ID}_${CONSUMER_NO}" "${ARGS[@]}"
          envFrom:
            - secretRef:
                name: {{ include "ragflow.fullname" . }}-env-config
          {{- if .Values.ragflow.mineru.enabled }}
            - configMapRef:
                name: {{ include "ragflow.fullname" . }}-mineru-env
          {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          {{- with .Values.ragflow.worker.extraEnv }}
          {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $probes := default (dict) .Values.ragflow.worker.probes }}
          {{- if $probes.liveness }}
          livenessProbe:
            {{- toYaml $probes.liveness | nindent 12 }}
          {{- else }}
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -lc
                - |
                  ps -p 1 -o cmd= | grep -q "rag/svr/task_executor.py"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          {{- end }}
          {{- if $probes.readiness }}
          readinessProbe:
            {{- toYaml $probes.readiness | nindent 12 }}
          {{- else }}
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -lc
                - |
                  ps -p 1 -o cmd= | grep -q "rag/svr/task_executor.py"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          {{- end }}
          {{- if $probes.startup }}
          startupProbe:
            {{- toYaml $probes.startup | nindent 12 }}
          {{- else }}
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -lc
                - |
                  ps -p 1 -o cmd= | grep -q "rag/svr/task_executor.py"
            periodSeconds: 10
            failureThreshold: 30
          {{- end }}
          volumeMounts:
            - mountPath: /ragflow/conf/service_conf.yaml
              subPath: service_conf.yaml
              name: service-conf-volume
            {{- if $localServiceConf }}
            - mountPath: /ragflow/conf/local.service_conf.yaml
              subPath: local.service_conf.yaml
              name: service-conf-volume
            {{- end }}
            {{- if $llmFactories }}
            - mountPath: /ragflow/conf/llm_factories.json
              subPath: llm_factories.json
              name: service-conf-volume
            {{- end }}
            {{- if and .Values.ragflow.mineru.enabled .Values.ragflow.mineru.persistence.enabled }}
            {{- if .Values.ragflow.mineru.persistence.venv.enabled }}
            - mountPath: /ragflow/uv_tools
              name: mineru-venv
              subPath: venv
            {{- end }}
            {{- if .Values.ragflow.mineru.persistence.cache.enabled }}
            - mountPath: /root/.cache
              name: mineru-cache
              subPath: cache
            {{- end }}
            {{- end }}
          {{- with .Values.ragflow.worker.deployment.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: service-conf-volume
          configMap:
            name: ragflow-service-config
        {{- if and .Values.ragflow.mineru.enabled .Values.ragflow.mineru.persistence.enabled }}
        {{- if .Values.ragflow.mineru.persistence.venv.enabled }}
        - name: mineru-venv
          persistentVolumeClaim:
            claimName: {{ include "ragflow.fullname" . }}-mineru-venv
        {{- end }}
        {{- if .Values.ragflow.mineru.persistence.cache.enabled }}
        - name: mineru-cache
          persistentVolumeClaim:
            claimName: {{ include "ragflow.fullname" . }}-mineru-cache
        {{- end }}
        {{- end }}
