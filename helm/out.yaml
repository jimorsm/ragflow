# Source: ragflow/templates/api.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-name-ragflow-api
  labels:
    helm.sh/chart: ragflow-0.2.0
    app.kubernetes.io/name: ragflow
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "v0.21.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ragflow
      app.kubernetes.io/instance: release-name
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ragflow
        app.kubernetes.io/instance: release-name
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          workingDir: /ragflow
          image: infiniflow/ragflow:v0.21.1-slim
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
            - |
              set -eo pipefail
              cd /ragflow

              # MinerU installation logic
              if [[ "${USE_MINERU}" == "true" ]]; then
                export HUGGINGFACE_HUB_ENDPOINT="${HF_ENDPOINT:-https://hf-mirror.com}"
                export PIP_INDEX_URL="${PIP_INDEX_URL:-https://pypi.org/simple}"
                export PIP_EXTRA_INDEX_URL="${PIP_EXTRA_INDEX_URL:-https://pypi.org/simple}"

                default_prefix="/ragflow/uv_tools"
                venv_dir="${default_prefix}/.venv"
                exe="${MINERU_EXECUTABLE:-${venv_dir}/bin/mineru}"
                expected_version="${MINERU_VERSION:-}"
                install_needed=0
                install_reason=""

                if [[ -x "${exe}" ]]; then
                  current_version="$("${exe}" --version 2>/dev/null | grep -Eo '[0-9]+\.[0-9.]*' | head -n1 || true)"
                  if [[ -n "${expected_version}" ]]; then
                    if [[ "${current_version}" != "${expected_version}" ]]; then
                      echo "[mineru] version mismatch: current=${current_version:-unknown}, expected=${expected_version}"
                      install_needed=1
                      install_reason="version_mismatch"
                    else
                      echo "[mineru] already installed: ${exe} (version ${current_version})"
                    fi
                  else
                    if [[ -n "${current_version}" ]]; then
                      echo "[mineru] already installed: ${exe} (version ${current_version})"
                    else
                      echo "[mineru] unable to determine current version, reinstalling..."
                      install_needed=1
                      install_reason="unknown_version"
                    fi
                  fi
                else
                  install_needed=1
                  install_reason="missing_executable"
                fi

                if [[ "${install_needed}" -eq 1 ]]; then
                  echo "[mineru] installing with mirrors..."
                  echo "[mineru] PyPI index: ${PIP_INDEX_URL}"
                  echo "[mineru] PyPI extra index: ${PIP_EXTRA_INDEX_URL}"
                  echo "[mineru] HF endpoint: ${HUGGINGFACE_HUB_ENDPOINT}"

                  mkdir -p "${default_prefix}"
                  cd "${default_prefix}"
                  if [[ "${install_reason}" == "version_mismatch" && -d "${venv_dir}" ]]; then
                    rm -rf "${venv_dir}"
                  fi
                  if [[ ! -d "${venv_dir}" ]]; then
                    uv venv "${venv_dir}"
                  fi
                  source "${venv_dir}/bin/activate"
                  pkg="mineru[core]"
                  if [[ -n "${expected_version}" ]]; then
                    pkg="${pkg}==${expected_version}"
                  fi
                  uv pip install -U "${pkg}" \
                    --index-url "${PIP_INDEX_URL}" \
                    --extra-index-url "${PIP_EXTRA_INDEX_URL}"
                  deactivate

                  if ! "${exe}" --help >/dev/null 2>&1; then
                    echo "[mineru] installation failed" >&2
                    exit 1
                  fi
                  if [[ -n "${expected_version}" ]]; then
                    echo "[mineru] installed successfully: ${exe} (version ${expected_version})"
                  else
                    echo "[mineru] installed successfully: ${exe}"
                  fi
                fi
                export MINERU_EXECUTABLE="${exe}"
              fi

              cd /ragflow

              # Application startup logic
              export LD_LIBRARY_PATH="/usr/lib/x86_64-linux-gnu/"
              exec python3 api/ragflow_server.py
          ports:
            - name: http
              containerPort: 9380
          livenessProbe:
            httpGet:
              path: /v1/system/healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /v1/system/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /v1/system/healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          envFrom:
            - secretRef:
                name: release-name-ragflow-env-config
          env:
            - name: FLASK_ENV
              value: "production"
            - name: FLASK_DEBUG
              value: "0"
          volumeMounts:
            - mountPath: /ragflow/conf/service_conf.yaml
              subPath: service_conf.yaml
              name: service-conf-volume
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: service-conf-volume
          configMap:
            name: ragflow-service-config
