                    uv venv "${venv_dir}"
                  fi
                  source "${venv_dir}/bin/activate"
                  pkg="mineru[core]"
                  if [[ -n "${expected_version}" ]]; then
                    pkg="${pkg}==${expected_version}"
                  fi
                  uv pip install -U "${pkg}" \
                    --index-url "${PIP_INDEX_URL}" \
                    --extra-index-url "${PIP_EXTRA_INDEX_URL}"
                  deactivate

                  if ! "${exe}" --help >/dev/null 2>&1; then
                    echo "[mineru] installation failed" >&2
                    exit 1
                  fi
                  if [[ -n "${expected_version}" ]]; then
                    echo "[mineru] installed successfully: ${exe} (version ${expected_version})"
                  else
                    echo "[mineru] installed successfully: ${exe}"
                  fi
                fi
                export MINERU_EXECUTABLE="${exe}"
              fi

              cd /ragflow

              # Application startup logic
              : "${POD_NAME:=$(hostname)}"
              export LD_LIBRARY_PATH="/usr/lib/x86_64-linux-gnu/"
              PY=python3
              JEMALLOC_PATH="$(pkg-config --variable=libdir jemalloc)/libjemalloc.so"
              HOST_ID="${HOST_ID:-${POD_NAME}}"
              CONSUMER_NO=0
              USE_RANGE=0
              if [[ "${USE_RANGE}" -eq 1 ]]; then
                CONSUMER_BEGIN=0
                CONSUMER_NO="${CONSUMER_BEGIN}"
              fi

              declare -a ARGS

              exec env LD_PRELOAD="${JEMALLOC_PATH}" "${PY}" rag/svr/task_executor.py "${HOST_ID}_${CONSUMER_NO}" "${ARGS[@]}"
          envFrom:
            - secretRef:
                name: release-name-ragflow-env-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -lc
                - |
                  ps -p 1 -o cmd= | grep -q "rag/svr/task_executor.py"
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -lc
                - |
                  ps -p 1 -o cmd= | grep -q "rag/svr/task_executor.py"
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -lc
                - |
                  ps -p 1 -o cmd= | grep -q "rag/svr/task_executor.py"
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - mountPath: /ragflow/conf/service_conf.yaml
              subPath: service_conf.yaml
              name: service-conf-volume
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: service-conf-volume
          configMap:
            name: ragflow-service-config
