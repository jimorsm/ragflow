# Source: ragflow/templates/frontend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-name-ragflow-frontend
  labels:
    helm.sh/chart: ragflow-0.2.0
    app.kubernetes.io/name: ragflow
    app.kubernetes.io/instance: release-name
    app.kubernetes.io/version: "v0.21.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ragflow
      app.kubernetes.io/instance: release-name
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ragflow
        app.kubernetes.io/instance: release-name
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: infiniflow/ragflow:v0.21.1-slim
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
            - |
              set -eo pipefail
              rm -f /var/run/nginx.pid
              mkdir -p /var/log/nginx
              rm -f /var/log/nginx/access.log /var/log/nginx/error.log
              ln -sf /proc/1/fd/1 /var/log/nginx/access.log
              ln -sf /proc/1/fd/2 /var/log/nginx/error.log

              calculate_workers() {
                local quota="$1"
                local period="$2"
                if [[ "${quota}" == "max" ]]; then
                  echo ""
                  return
                fi
                if [[ "${quota}" -gt 0 && "${period}" -gt 0 ]]; then
                  echo $(( (quota + period - 1) / period ))
                else
                  echo ""
                fi
              }

              detect_worker_processes() {
                local workers=""
                if [[ -f /sys/fs/cgroup/cpu.max ]]; then
                  read -r quota period < /sys/fs/cgroup/cpu.max || true
                  workers=$(calculate_workers "${quota}" "${period}")
                elif [[ -f /sys/fs/cgroup/cpu/cpu.cfs_quota_us ]]; then
                  quota=$(cat /sys/fs/cgroup/cpu/cpu.cfs_quota_us 2>/dev/null || echo "")
                  period=$(cat /sys/fs/cgroup/cpu/cpu.cfs_period_us 2>/dev/null || echo "")
                  workers=$(calculate_workers "${quota:-0}" "${period:-0}")
                fi

                if [[ -z "${workers}" ]]; then
                  workers=$(nproc 2>/dev/null || echo "")
                fi

                if [[ -z "${workers}" || "${workers}" -le 0 ]]; then
                  workers=1
                fi

                echo "${workers}"
              }

              workers="$(detect_worker_processes)"
              export NGINX_WORKER_PROCESSES="${workers}"

              tmp_nginx_dir="$(mktemp -d)"
              if command -v envsubst >/dev/null 2>&1; then
                envsubst '${NGINX_WORKER_PROCESSES}' </etc/nginx/nginx.conf > "${tmp_nginx_dir}/nginx.conf"
              else
                sed "s|\${NGINX_WORKER_PROCESSES}|${NGINX_WORKER_PROCESSES}|g" /etc/nginx/nginx.conf > "${tmp_nginx_dir}/nginx.conf"
              fi

              exec /usr/sbin/nginx -c "${tmp_nginx_dir}/nginx.conf" -g 'daemon off;'
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - secretRef:
                name: release-name-ragflow-env-config
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - mountPath: /etc/nginx/conf.d/ragflow.conf
              subPath: ragflow.conf
              name: nginx-config
            - mountPath: /etc/nginx/proxy.conf
              subPath: proxy.conf
              name: nginx-config
            - mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              name: nginx-config
          resources:
            limits:
              cpu: 500m
              memory: 500Mi
            requests:
              cpu: 200m
              memory: 200Mi
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
